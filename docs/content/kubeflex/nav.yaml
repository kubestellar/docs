# Sidebar navigation for the kubeflex project (PROJECTS['kubeflex'].navPath).
# Paths are relative to docs/content/kubeflex/.
# Each top-level entry is a sidebar section: { title, items }. Items are
#   - Title: relative/path.md            (page)
#   - Title:                             (folder)
#       - Child Title: relative/path.md
#   - https://example.com or /abs/path   (external / absolute link, as a value)
# A page that is not listed here does not appear in the sidebar.
# Schema is validated at build time by loadNavFile() in src/app/docs/page-map.ts.
# See kubestellar/docs#7080.
- title: Overview
  items:
    - Introduction: readme.md
    - Architecture: architecture.md
    - Multi-Tenancy: multi-tenancy.md
- title: Getting Started
  items:
    - Quick Start: quickstart.md
    - User Guide: users.md
- title: Development
  items:
    - Debugging: debugging.md
    - Code Generation: code-generation.md
    - PostgreSQL Architecture: postgresql-architecture-decision.md
- title: Community
  items:
    - Contributors: contributors.md
