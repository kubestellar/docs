# Prometheus Operator alerting rules for the docs site's existing
# `/api/metrics` endpoint (src/app/api/metrics/route.ts, src/lib/metrics.ts),
# already scraped by cluster-objects/servicemonitor.yaml.
#
# This resource only takes effect if a Prometheus Operator with the
# PrometheusRule CRD is already watching this namespace/selector, and only
# if servicemonitor.yaml is applied so the referenced metrics are actually
# being scraped. It does not install an operator, does not configure any
# exporter, and does not send data off-box — it only defines evaluation
# rules over metrics already produced in-process by this application.
#
# Both alerts use metric/label names defined in src/lib/metrics.ts:
#   docs_api_requests_total{route, method, status_class}
#   docs_api_request_duration_seconds{route, method}
# `route` and `status_class` are fixed, bounded label sets (see the
# cardinality note in that file), so these rules cannot grow unbounded
# label cardinality.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: kubestellar-docs
  namespace: docs
  labels:
    app: kubestellar-docs
    pr: prod
spec:
  groups:
    - name: kubestellar-docs.rules
      rules:
        - alert: DocsApiHighErrorRate
          expr: >-
            sum(rate(docs_api_requests_total{status_class="5xx"}[5m]))
            /
            sum(rate(docs_api_requests_total[5m]))
            > 0.05
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Docs site API 5xx rate is above threshold"
            description: >-
              More than 5% of requests to the docs site's instrumented API
              routes (search, docs-image) have returned a 5xx status over
              the last 5 minutes (current value: {{ $value | humanizePercentage }}).
            runbook_url: "https://github.com/kubestellar/docs/blob/main/runbooks/api-error-rate-latency.md"
        - alert: DocsApiHighRequestLatency
          expr: >-
            histogram_quantile(0.95,
              sum(rate(docs_api_request_duration_seconds_bucket[5m])) by (le)
            ) > 1
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Docs site API p95 request latency is elevated"
            description: >-
              The 95th percentile request latency for the docs site's
              instrumented API routes has exceeded 1s over the last 5
              minutes (current value: {{ $value | humanizeDuration }}).
            runbook_url: "https://github.com/kubestellar/docs/blob/main/runbooks/api-error-rate-latency.md"
