# Prometheus alerting rules for the docs site's existing `/api/metrics`
# endpoint (src/lib/metrics.ts, docs_api_requests_total /
# docs_api_request_duration_seconds). This is a pull-only PrometheusRule:
# it only takes effect if a Prometheus Operator is already watching this
# namespace/selector (see cluster-objects/servicemonitor.yaml). It does
# not install an exporter, does not configure a backend, and does not
# send data off-box. No observability backend is confirmed for this repo;
# this resource is provided for an operator-managed Prometheus, if present.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: kubestellar-docs-api-alerts
  namespace: docs
  labels:
    app: kubestellar-docs
    pr: prod
spec:
  groups:
    - name: kubestellar-docs-api
      rules:
        - alert: DocsApiHighErrorRatio
          # Fixed, bounded label set only (route, status_class from the
          # ApiRoutes union in src/lib/metrics.ts) — no user-controlled
          # values are ever used as label values here.
          expr: >-
            sum(rate(docs_api_requests_total{status_class=~"4xx|5xx"}[5m]))
            /
            sum(rate(docs_api_requests_total[5m]))
            > 0.10
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Docs site API error ratio above 10% for 10m"
            description: >-
              More than 10% of requests to the docs site's /api routes have
              returned a 4xx or 5xx status over the last 5 minutes,
              sustained for 10 minutes. See src/lib/metrics.ts and
              src/lib/logger.ts for the emitting instrumentation.
            runbook_url: "https://github.com/kubestellar/docs/blob/main/runbooks/api-error-rate-latency.md"
        - alert: DocsApiHighLatencyP95
          expr: >-
            histogram_quantile(0.95, sum by (le) (rate(docs_api_request_duration_seconds_bucket[5m])))
            > 2
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Docs site API p95 latency above 2s for 10m"
            description: >-
              The 95th percentile request duration across instrumented
              docs site /api routes has exceeded 2 seconds, sustained for
              10 minutes.
            runbook_url: "https://github.com/kubestellar/docs/blob/main/runbooks/api-error-rate-latency.md"
