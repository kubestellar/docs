apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubestellar-docs
  namespace: docs
  labels:
    app: kubestellar-docs
    pr: prod
spec:
  replicas: 3
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: kubestellar-docs
      pr: prod
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app: kubestellar-docs
        pr: prod
    spec:
      imagePullSecrets:
        - name: ocir-secret
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
      containers:
        - name: kubestellar-docs
          image: iad.ocir.io/id4wyucbsggm/kubestellar-docs:stable
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          env:
            - name: NODE_ENV
              value: production
          # /api/healthz checks the one dependency required to serve real
          # traffic (the docs/content tree — see src/app/api/healthz/route.ts
          # and runbooks/deploy-rollback.md). Wiring it here lets the
          # orchestrator stop routing to instances that are up but serving
          # broken or empty documentation, matching the same check already
          # used by the container image's Docker HEALTHCHECK.
          readinessProbe:
            httpGet:
              path: /api/healthz
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          # Liveness intentionally targets /api/livez, NOT /api/healthz.
          # /api/healthz depends on the docs content tree; a failed
          # liveness check makes the orchestrator kill and restart the
          # container, which cannot fix a missing/misconfigured content
          # volume. Because all replicas share the same image/volume, that
          # shared-cause failure would fail liveness on every replica at
          # once and turn a readiness-level outage into a simultaneous
          # restart loop across the whole Deployment. /api/livez only
          # confirms the process is up and able to handle a request.
          livenessProbe:
            httpGet:
              path: /api/livez
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: kubestellar-docs
  namespace: docs
  labels:
    app: kubestellar-docs
    pr: prod
  annotations:
    # Pull-only scrape hints for a cluster Prometheus, if one is present.
    # This does not configure any exporter or send data off-box; it only
    # advertises the existing in-process registry already served at
    # /api/metrics (see src/lib/metrics.ts, src/app/api/metrics/route.ts).
    prometheus.io/scrape: "true"
    prometheus.io/path: /api/metrics
    prometheus.io/port: "3000"
spec:
  type: ClusterIP
  selector:
    app: kubestellar-docs
    pr: prod
  ports:
    - name: http
      port: 80
      targetPort: 3000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kubestellar-docs
  namespace: docs
  labels:
    app: kubestellar-docs
    pr: prod
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
    - host: prod.previews.kubestellar.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kubestellar-docs
                port:
                  number: 80
