name: Run All Maintainer Audits

on:
  workflow_dispatch:
  schedule:
    # Run every Monday at 12:00 PM Eastern (17:00 UTC)
    - cron: "0 17 * * 1"

permissions: read-all

jobs:
  audit-all:
    # actions:write needed to trigger maintainer-metrics.lock.yml workflow via gh workflow run
    # This is the minimum permission required for workflow_dispatch operations
    # issues:write needed by the failure alert step to open or comment on a tracking issue
    permissions:
      contents: read
      actions: write
      issues: write
    runs-on: ubuntu-latest

    steps:
      - name: Run audits for all maintainers sequentially
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # List of all maintainers
          MAINTAINERS=(
            "clubanderson"
            "dumb0002"
            "francostellari"
            "kproche"
            "mikespreitzer"
            "pdettori"
            "waltforme"
          )

          echo "🚀 Starting sequential maintainer audits for ${#MAINTAINERS[@]} maintainers..."
          echo "Each audit will wait 3.5 minutes before starting the next one."
          echo ""

          for maintainer in "${MAINTAINERS[@]}"; do
            echo "📧 Triggering audit for: $maintainer"
            
            gh workflow run maintainer-metrics.lock.yml \
              --repo ${{ github.repository }} \
              --ref ${{ github.ref_name }} \
              --field maintainer="$maintainer"
            
            if [ $? -eq 0 ]; then
              echo "Successfully triggered audit for $maintainer" 
            else
              echo "❌ Failed to trigger audit for $maintainer"
              exit 1
            fi
            
            # Don't sleep after the last maintainer
            if [ "$maintainer" != "${MAINTAINERS[-1]}" ]; then
              echo "⏳ Waiting 3.5 minutes before next audit..."
              sleep 210
              echo ""
            fi
          done

          echo ""
          echo "🎉 All maintainer audits have been triggered!"

      - name: Create issue on failure
        if: failure()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ github.token }}
          script: |
            const tag = '[maintainer-audit-failure]';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'ci-failure',
              per_page: 20,
            });
            const existing = issues.find(i => i.title.includes(tag));
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: `Still failing as of ${new Date().toISOString().slice(0, 10)}. [Run](${runUrl})`,
              });
              return;
            }
            try {
              await github.rest.issues.getLabel({ owner: context.repo.owner, repo: context.repo.repo, name: 'ci-failure' });
            } catch {
              await github.rest.issues.createLabel({ owner: context.repo.owner, repo: context.repo.repo, name: 'ci-failure', color: 'b60205' });
            }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `${tag} Weekly maintainer audits workflow failing`,
              body: [
                '## Weekly maintainer audits are failing',
                '',
                `**Run:** [${context.runId}](${runUrl})`,
                `**Date:** ${new Date().toISOString().slice(0, 10)}`,
                '',
                'Run All Maintainer Audits failed while triggering `maintainer-metrics.lock.yml`. Some or all of this week\'s maintainer audits were not started; check the run log for the maintainer it stopped at.',
                '',
                '### Re-run',
                '```bash',
                'gh workflow run run-all-maintainer-audits.yml --repo kubestellar/docs',
                '```',
                '',
                '> Auto-generated. This issue will receive comments on subsequent failures.',
              ].join('\n'),
              labels: ['ci-failure'],
            });
