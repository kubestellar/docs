name: Stale Issues

on:
  schedule:
    - cron: '0 0 * * *'  # Daily at midnight UTC
  workflow_dispatch:

permissions:
  issues: write

jobs:
  stale:
    uses: kubestellar/infra/.github/workflows/reusable-stale.yml@220beeeb8dae67e2fd8e89338ada8144609fc6ef  # main
    with:
      exempt_labels: security,bug,enhancement,good first issue,help wanted,hacktober-fest,lifecycle/frozen,stale-exempt,ci-failure,site-outage,kind/incident
    secrets: inherit

  alert-on-failure:
    # The work runs in a reusable workflow, so the alert is a separate job.
    needs: [stale]
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Create issue on failure
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ github.token }}
          script: |
            const tag = '[stale-workflow-failure]';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'ci-failure',
              per_page: 20,
            });
            const existing = issues.find(i => i.title.includes(tag));
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: `Still failing as of ${new Date().toISOString().slice(0, 10)}. [Run](${runUrl})`,
              });
              return;
            }
            try {
              await github.rest.issues.getLabel({ owner: context.repo.owner, repo: context.repo.repo, name: 'ci-failure' });
            } catch {
              await github.rest.issues.createLabel({ owner: context.repo.owner, repo: context.repo.repo, name: 'ci-failure', color: 'b60205' });
            }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `${tag} Stale Issues workflow failing`,
              body: [
                '## Stale Issues workflow is failing',
                '',
                `**Run:** [${context.runId}](${runUrl})`,
                `**Date:** ${new Date().toISOString().slice(0, 10)}`,
                '',
                'The daily Stale Issues run failed, so inactive issues and PRs are not being labelled or closed until it succeeds.',
                '',
                '### Re-run',
                '```bash',
                'gh workflow run stale.yml --repo kubestellar/docs',
                '```',
                '',
                '> Auto-generated. This issue will receive comments on subsequent failures.',
              ].join('\n'),
              labels: ['ci-failure'],
            });
