name: Netlify Deploy Failure Reporter

# Addresses: kubestellar/docs#6778
# The report-netlify-failure job is purely event-reactive: it only runs
# when GitHub receives a `status` event from Netlify's GitHub integration.
# If that integration itself goes silent (revoked/misconfigured GitHub
# App, broken webhook, Netlify-side outage), no status event ever
# arrives and this workflow never runs — zero signal, not a failure
# alert. The check-deploy-freshness job below is a low-frequency
# scheduled watchdog that compares the latest Netlify deploy's
# commit_ref against the current HEAD of main, independent of whether
# any status event ever fires.

on:
  status:
  schedule:
    # Every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions: read-all  # default read; writes scoped to jobs below

jobs:
  report-netlify-failure:
    if: >-
      github.event_name == 'status' &&
      github.event.state == 'failure' &&
      contains(github.event.context, 'netlify')
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      issues: write
      statuses: read
    steps:
      - name: Find PR for this commit
        id: find-pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          COMMIT_SHA="${{ github.event.sha }}"
          PR_NUMBER=$(gh api "repos/${{ github.repository }}/commits/${COMMIT_SHA}/pulls" \
            --jq '.[0].number // empty' 2>/dev/null || true)
          echo "pr_number=${PR_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "commit_sha=${COMMIT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Fetch Netlify deploy error
        id: netlify
        env:
          NETLIFY_API_TOKEN: ${{ secrets.NETLIFY_API_TOKEN }}
        run: |
          SITE_ID="f24d63c2-83cc-4384-a3db-b0db089c7091"
          COMMIT_SHA="${{ steps.find-pr.outputs.commit_sha }}"

          if [ -z "$NETLIFY_API_TOKEN" ]; then
            echo "Missing NETLIFY_API_TOKEN secret"
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          DEPLOY_JSON=$(curl -sf \
            -H "Authorization: Bearer ${NETLIFY_API_TOKEN}" \
            "https://api.netlify.com/api/v1/sites/${SITE_ID}/deploys?per_page=20" \
            | jq --arg sha "$COMMIT_SHA" '[.[] | select(.commit_ref == $sha)] | first // empty')

          if [ -z "$DEPLOY_JSON" ] || [ "$DEPLOY_JSON" = "null" ]; then
            echo "No deploy found for commit ${COMMIT_SHA}"
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          DEPLOY_ID=$(echo "$DEPLOY_JSON" | jq -r '.id')
          ERROR_MSG=$(echo "$DEPLOY_JSON" | jq -r '.error_message // empty')
          DEPLOY_STATE=$(echo "$DEPLOY_JSON" | jq -r '.state')
          ADMIN_URL=$(echo "$DEPLOY_JSON" | jq -r '.admin_url // empty')

          if [ -z "$ERROR_MSG" ] && [ "$DEPLOY_STATE" = "error" ]; then
            LOG_OUTPUT=$(curl -sf \
              -H "Authorization: Bearer ${NETLIFY_API_TOKEN}" \
              "https://api.netlify.com/api/v1/deploys/${DEPLOY_ID}/log" \
              | jq -r '.[] | select(.section == "building" or .section == "preparation") | .message' \
              | grep -i "error\|fail\|fatal" | head -10 || true)
            if [ -n "$LOG_OUTPUT" ]; then
              ERROR_MSG="$LOG_OUTPUT"
            else
              ERROR_MSG="Deploy failed (no error message available — check Netlify dashboard)"
            fi
          fi

          if [ -n "$ERROR_MSG" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "deploy_id=${DEPLOY_ID}" >> "$GITHUB_OUTPUT"
            echo "$ERROR_MSG" > /tmp/netlify_error.txt
            echo "admin_url=${ADMIN_URL}" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Post comment on PR
        if: steps.netlify.outputs.found == 'true' && steps.find-pr.outputs.pr_number != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR_NUMBER="${{ steps.find-pr.outputs.pr_number }}"
          DEPLOY_ID="${{ steps.netlify.outputs.deploy_id }}"
          ADMIN_URL="${{ steps.netlify.outputs.admin_url }}"
          ERROR_MSG=$(cat /tmp/netlify_error.txt)

          EXISTING=$(gh api "repos/${{ github.repository }}/issues/${PR_NUMBER}/comments" \
            --jq "[.[] | select(.body | contains(\"${DEPLOY_ID}\"))] | length" 2>/dev/null || echo "0")

          if [ "$EXISTING" != "0" ]; then
            echo "Already commented on deploy ${DEPLOY_ID}, skipping"
            exit 0
          fi

          BODY=$(cat <<EOF
          ## Netlify Deploy Preview Failed

          **Deploy ID:** \`${DEPLOY_ID}\`
          **Dashboard:** ${ADMIN_URL}

          \`\`\`
          ${ERROR_MSG}
          \`\`\`

          <sub>Posted by netlify-error-reporter workflow</sub>
          EOF
          )

          gh api "repos/${{ github.repository }}/issues/${PR_NUMBER}/comments" \
            -f body="$BODY"

      - name: Open issue for direct-to-main failures
        if: steps.netlify.outputs.found == 'true' && steps.find-pr.outputs.pr_number == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DEPLOY_ID="${{ steps.netlify.outputs.deploy_id }}"
          ADMIN_URL="${{ steps.netlify.outputs.admin_url }}"
          COMMIT_SHA="${{ steps.find-pr.outputs.commit_sha }}"
          ERROR_MSG=$(cat /tmp/netlify_error.txt)
          TAG="[netlify-deploy-failure]"

          EXISTING=$(gh api -X GET search/issues \
            -f q="repo:${{ github.repository }} is:issue is:open in:title \"${TAG}\"" \
            --jq '.total_count' 2>/dev/null || echo "0") || echo "0"

          if [ "$EXISTING" != "0" ]; then
            ISSUE_NUMBER=$(gh api -X GET search/issues \
              -f q="repo:${{ github.repository }} is:issue is:open in:title \"${TAG}\"" \
              --jq '.items[0].number') || ISSUE_NUMBER=""
            gh api "repos/${{ github.repository }}/issues/${ISSUE_NUMBER}/comments" \
              -f body="Still failing as of $(date -u +%Y-%m-%dT%H:%M:%SZ).

          **Commit:** ${COMMIT_SHA}
          **Deploy ID:** \`${DEPLOY_ID}\`
          **Dashboard:** ${ADMIN_URL}

          \`\`\`
          ${ERROR_MSG}
          \`\`\`"
            echo "Commented on existing issue #${ISSUE_NUMBER}"
            exit 0
          fi

          gh label create "ci-failure" --color "b60205" --description "CI/CD pipeline failure" \
            --repo "${{ github.repository }}" 2>/dev/null || true

          gh issue create \
            --repo "${{ github.repository }}" \
            --title "${TAG} Netlify production deploy failing" \
            --label "ci-failure,kind/bug" \
            --body "## Netlify production deploy is failing

          The Netlify build for a direct-to-main commit failed. The live site is serving stale content until this is resolved.

          **Commit:** [\`${COMMIT_SHA}\`](https://github.com/${{ github.repository }}/commit/${COMMIT_SHA})
          **Deploy ID:** \`${DEPLOY_ID}\`
          **Dashboard:** ${ADMIN_URL}

          \`\`\`
          ${ERROR_MSG}
          \`\`\`

          ### Impact
          - Leaderboard data is not updating on the live site
          - Any other static data committed to main is stale

          > Auto-generated by netlify-error-reporter. Subsequent failures will be appended as comments."

  check-deploy-freshness:
    name: Check Netlify deploy freshness
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Compare latest Netlify deploy against HEAD of main
        id: freshness
        env:
          NETLIFY_API_TOKEN: ${{ secrets.NETLIFY_API_TOKEN }}
        run: |
          SITE_ID="f24d63c2-83cc-4384-a3db-b0db089c7091"
          HEAD_SHA=$(git rev-parse HEAD)

          if [ -z "$NETLIFY_API_TOKEN" ]; then
            echo "Missing NETLIFY_API_TOKEN secret, cannot check freshness"
            echo "stale=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          DEPLOYS_JSON=$(curl -sf \
            -H "Authorization: ******" \
            "https://api.netlify.com/api/v1/sites/${SITE_ID}/deploys?per_page=20") || {
            echo "Failed to reach Netlify API"
            echo "stale=false" >> "$GITHUB_OUTPUT"
            exit 0
          }

          # Latest published production deploy, most recent first.
          LATEST=$(echo "$DEPLOYS_JSON" | jq '[.[] | select(.state == "ready")] | first // empty')

          if [ -z "$LATEST" ] || [ "$LATEST" = "null" ]; then
            echo "No ready deploys found"
            echo "stale=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          LATEST_SHA=$(echo "$LATEST" | jq -r '.commit_ref // empty')
          DEPLOY_ID=$(echo "$LATEST" | jq -r '.id')
          ADMIN_URL=$(echo "$LATEST" | jq -r '.admin_url // empty')
          CREATED_AT=$(echo "$LATEST" | jq -r '.created_at // empty')

          echo "HEAD of main: ${HEAD_SHA}"
          echo "Latest Netlify deploy commit: ${LATEST_SHA}"

          if [ -z "$LATEST_SHA" ] || [ "$LATEST_SHA" = "$HEAD_SHA" ]; then
            echo "stale=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Diverged: check whether HEAD is already among the recent deploys
          # (i.e. a deploy for it exists but isn't the "latest ready" one,
          # which can happen with concurrent/queued builds — not stale yet).
          HEAD_DEPLOY=$(echo "$DEPLOYS_JSON" | jq --arg sha "$HEAD_SHA" '[.[] | select(.commit_ref == $sha)] | first // empty')
          if [ -n "$HEAD_DEPLOY" ] && [ "$HEAD_DEPLOY" != "null" ]; then
            echo "A deploy for HEAD already exists among recent deploys, not stale"
            echo "stale=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "stale=true" >> "$GITHUB_OUTPUT"
          echo "head_sha=${HEAD_SHA}" >> "$GITHUB_OUTPUT"
          echo "latest_sha=${LATEST_SHA}" >> "$GITHUB_OUTPUT"
          echo "deploy_id=${DEPLOY_ID}" >> "$GITHUB_OUTPUT"
          echo "admin_url=${ADMIN_URL}" >> "$GITHUB_OUTPUT"
          echo "created_at=${CREATED_AT}" >> "$GITHUB_OUTPUT"

      - name: Open or update issue for stale deploy
        if: steps.freshness.outputs.stale == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          HEAD_SHA="${{ steps.freshness.outputs.head_sha }}"
          LATEST_SHA="${{ steps.freshness.outputs.latest_sha }}"
          DEPLOY_ID="${{ steps.freshness.outputs.deploy_id }}"
          ADMIN_URL="${{ steps.freshness.outputs.admin_url }}"
          CREATED_AT="${{ steps.freshness.outputs.created_at }}"
          TAG="[netlify-deploy-stale]"

          EXISTING=$(gh api -X GET search/issues \
            -f q="repo:${{ github.repository }} is:issue is:open in:title \"${TAG}\"" \
            --jq '.items[0].number' 2>/dev/null || true)

          BODY=$(cat <<EOF
          Still stale as of $(date -u +%Y-%m-%dT%H:%M:%SZ).

          **HEAD of main:** [\`${HEAD_SHA}\`](https://github.com/${{ github.repository }}/commit/${HEAD_SHA})
          **Latest Netlify deploy commit:** \`${LATEST_SHA}\`
          **Deploy ID:** \`${DEPLOY_ID}\`
          **Deploy created at:** ${CREATED_AT}
          **Dashboard:** ${ADMIN_URL}
          EOF
          )

          if [ -n "$EXISTING" ] && [ "$EXISTING" != "null" ]; then
            gh api "repos/${{ github.repository }}/issues/${EXISTING}/comments" -f body="$BODY"
            echo "Commented on existing issue #${EXISTING}"
            exit 0
          fi

          gh label create "ci-failure" --color "b60205" --description "CI/CD pipeline failure" \
            --repo "${{ github.repository }}" 2>/dev/null || true

          gh issue create \
            --repo "${{ github.repository }}" \
            --title "${TAG} Netlify deploy is stale or Netlify status integration is silent" \
            --label "ci-failure,kind/bug" \
            --body "## Netlify production deploy appears stale

          The latest Netlify deploy's commit does not match the current HEAD of \`main\`, and no in-progress deploy for HEAD was found. This can mean the Netlify build is failing without a corresponding GitHub \`status\` event (e.g. broken Netlify↔GitHub integration, revoked GitHub App, or webhook outage), so \`netlify-error-reporter\`'s event-reactive job never runs.

          **HEAD of main:** [\`${HEAD_SHA}\`](https://github.com/${{ github.repository }}/commit/${HEAD_SHA})
          **Latest Netlify deploy commit:** \`${LATEST_SHA}\`
          **Deploy ID:** \`${DEPLOY_ID}\`
          **Deploy created at:** ${CREATED_AT}
          **Dashboard:** ${ADMIN_URL}

          ### Impact
          - The live site may be serving stale content from an older commit.
          - \`/api/healthz\` will still report \`200 ok\` since it only checks for presence of content, not freshness.

          ### Next steps
          - Check the Netlify dashboard for build errors on the latest commit.
          - Verify the Netlify GitHub App / webhook integration is still active.

          > Auto-generated by netlify-error-reporter (check-deploy-freshness). Subsequent failures will be appended as comments."
