name: Vitest

on:
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - "vitest.config.ts"
      - "next.config.*"
      - ".github/workflows/vitest.yml"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - "vitest.config.ts"
      - "next.config.*"
      - ".github/workflows/vitest.yml"

concurrency:
  group: vitest-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: read-all  # default read; writes scoped to job below

jobs:
  test:
    name: Run unit tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run Vitest suite with coverage
        id: vitest
        run: npx vitest run --coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

      - name: CI Observability Summary
        if: always()
        run: |
          VITEST_OUTCOME="${{ steps.vitest.outcome }}"
          echo "CI_OBSERVABILITY check=vitest vitest=${VITEST_OUTCOME} status=${VITEST_OUTCOME}"
          if [ -n "$GITHUB_STEP_SUMMARY" ]; then
            ICON=$([ "$VITEST_OUTCOME" = "success" ] && echo "✅" || echo "❌")
            cat <<EOF >> "$GITHUB_STEP_SUMMARY"
          ## Vitest Summary

          | Check | Outcome | Status |
          | --- | --- | --- |
          | Vitest (with coverage) | \`$VITEST_OUTCOME\` | $ICON |
          EOF
          fi
