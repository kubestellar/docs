name: Dashboard Lint

on:
  pull_request:
    branches: [main]
    paths:
      - "cluster-objects/dashboard.json"
      - "cluster-objects/alerts.yaml"
      - "src/lib/metrics.ts"
      - "scripts/lint-dashboard.mjs"
      - "scripts/lint-dashboard-helpers.mjs"
      - ".github/workflows/dashboard-lint.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: read-all  # default read; no write permissions needed

jobs:
  dashboard-lint:
    name: dashboard-lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Lint dashboard JSON and alert-rule YAML
        run: npm run lint:dashboard
