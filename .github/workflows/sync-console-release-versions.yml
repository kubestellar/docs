name: Sync Console Release Versions

on:
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * *'


permissions: read-all  # default read; writes scoped to job below

jobs:
  sync-console-releases:
    permissions:
      # WORKFLOW_SYNC_TOKEN used for all write operations; GITHUB_TOKEN only needs read
      contents: read
      pull-requests: read
      # issues:write for the failure alert step (GITHUB_TOKEN)
      issues: write
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.WORKFLOW_SYNC_TOKEN }}
    steps:
      - name: Checkout docs repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.WORKFLOW_SYNC_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Discover stable console releases
        id: releases
        run: |
          RELEASES_JSON_FILE=$(mktemp)
          gh api repos/kubestellar/console/releases --paginate > "$RELEASES_JSON_FILE"
          RELEASES_JSON_FILE="$RELEASES_JSON_FILE" node - <<'NODE' >> "$GITHUB_OUTPUT"
          const fs = require('fs')
          const releases = JSON.parse(fs.readFileSync(process.env.RELEASES_JSON_FILE, 'utf8') || '[]')
            .filter((release) => !release.draft && !release.prerelease)
            .map((release) => release.tag_name)
            .filter((tag) => /^v\d+\.\d+\.\d+$/.test(tag))
            .map((tag) => tag.slice(1))
            .sort((a, b) => {
              const aParts = a.split('.').map(Number)
              const bParts = b.split('.').map(Number)
              for (let i = 0; i < Math.max(aParts.length, bParts.length); i += 1) {
                const diff = (aParts[i] ?? 0) - (bParts[i] ?? 0)
                if (diff !== 0) return diff
              }
              return 0
            })

          if (releases.length === 0) {
            console.log('No stable console releases found; skipping sync')
            console.log('latest=')
            console.log('historical=')
            console.log('all=')
            process.exit(0)
          }

          const latest = releases[releases.length - 1]
          const historical = releases.filter((version) => version !== latest)

          console.log(`latest=${latest}`)
          console.log(`historical=${historical.join(' ')}`)
          console.log(`all=${releases.join(' ')}`)
          NODE

      - name: Ensure console version branches exist
        run: |
          git fetch origin
          for version in ${{ steps.releases.outputs.all }}; do
            branch="docs/console/${version}"
            if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
              echo "✅ Branch $branch already exists"
              continue
            fi

            git branch -f "$branch" origin/main
            git push origin "$branch"
            echo "✅ Created $branch"
          done

      - name: Update main branch version metadata
        id: update-config
        run: |
          SYNC_BRANCH="sync-console-release-versions"
          git checkout -B "$SYNC_BRANCH" origin/main

          for version in ${{ steps.releases.outputs.historical }}; do
            node scripts/update-version.js \
              --project console \
              --version "$version" \
              --branch "docs/console/${version}"
          done

          node scripts/update-version.js \
            --project console \
            --version "${{ steps.releases.outputs.latest }}" \
            --branch "docs/console/${{ steps.releases.outputs.latest }}" \
            --set-latest

          git add src/config/versions.ts public/config/shared.json
          if git diff --cached --quiet; then
            echo "updated=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git commit -s -m "📖 Sync console release versions" \
            -m "Co-authored-by: Copilot <223556219+Copilot@users.noreply.github.com>"
          git push -f origin "$SYNC_BRANCH"
          echo "updated=true" >> "$GITHUB_OUTPUT"

      - name: Create or update PR
        if: steps.releases.outputs.latest != ''
        run: |
          PR_TITLE="📖 Sync console docs versions"
          PR_BODY=$(cat <<'EOF'
          Fixes #1833

          ## Summary
          - sync released console versions into the docs version config
          - create missing `docs/console/*` release branches
          - keep future console releases from falling behind the picker
          EOF
          )

          EXISTING_PR=$(gh pr list \
            --head sync-console-release-versions \
            --json number \
            --jq '.[0].number' 2>/dev/null || true)

          if [ -n "$EXISTING_PR" ]; then
            gh pr edit "$EXISTING_PR" --title "$PR_TITLE" --body "$PR_BODY"
            exit 0
          fi

          if [ "${{ steps.update-config.outputs.updated }}" != 'true' ]; then
            echo "No main-branch config changes detected; skipping PR creation"
            exit 0
          fi

          gh pr create \
            --title "$PR_TITLE" \
            --body "$PR_BODY" \
            --base main \
            --head sync-console-release-versions

      - name: Create issue on failure
        if: failure()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ github.token }}
          script: |
            const tag = '[sync-console-versions-failure]';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'ci-failure',
              per_page: 20,
            });
            const existing = issues.find(i => i.title.includes(tag));
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: `Still failing as of ${new Date().toISOString().slice(0, 10)}. [Run](${runUrl})`,
              });
              return;
            }
            try {
              await github.rest.issues.getLabel({ owner: context.repo.owner, repo: context.repo.repo, name: 'ci-failure' });
            } catch {
              await github.rest.issues.createLabel({ owner: context.repo.owner, repo: context.repo.repo, name: 'ci-failure', color: 'b60205' });
            }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `${tag} Sync Console Release Versions workflow failing`,
              body: [
                '## Console release version sync is failing',
                '',
                `**Run:** [${context.runId}](${runUrl})`,
                `**Date:** ${new Date().toISOString().slice(0, 10)}`,
                '',
                'The daily Sync Console Release Versions run failed. New console releases may be missing from the docs version picker until it succeeds.',
                '',
                '### Re-run',
                '```bash',
                'gh workflow run sync-console-release-versions.yml --repo kubestellar/docs',
                '```',
                '',
                '> Auto-generated. This issue will receive comments on subsequent failures.',
              ].join('\n'),
              labels: ['ci-failure'],
            });
