name: gh-aw Lock Drift Check

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/*.md"
      - ".github/workflows/*.lock.yml"
      - "scripts/check-aw-lock-drift.mjs"
      - ".github/workflows/check-aw-lock-drift.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check-aw-lock-drift:
    name: gh-aw frontmatter hash matches lock file
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Compare gh-aw frontmatter hashes
        run: node scripts/check-aw-lock-drift.mjs
