name: Fuzz MDX Sanitizer

# Addresses: kubestellar/docs#6223
# Runs the mutation-based fuzz harness for sanitizeHtmlForMdx on a weekly
# schedule and on any PR that touches the sanitizer or this workflow.

on:
  schedule:
    # Every Monday at 03:00 UTC
    - cron: '0 3 * * 1'
  pull_request:
    branches: [main]
    paths:
      - 'src/lib/sanitizeHtml.ts'
      - '.github/fuzzing/fuzz-mdx-sanitizer.ts'
      - '.github/workflows/fuzz-mdx.yml'
  workflow_dispatch:
    inputs:
      iterations:
        description: 'Number of fuzz iterations'
        required: false
        default: '20000'
      seed:
        description: 'PRNG seed (leave empty for random)'
        required: false
        default: ''

permissions: {}  # no default permissions; this job needs no token access

jobs:
  fuzz:
    name: Fuzz sanitizeHtmlForMdx
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # issues:write for the scheduled-run failure alert step
      issues: write
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run fuzz harness
        env:
          FUZZ_SEED: ${{ github.event.inputs.seed || '' }}
          FUZZ_ITERATIONS: ${{ github.event.inputs.iterations || '20000' }}
        run: |
          set -euo pipefail
          # Validate iterations is a plain positive integer (max 10 digits) —
          # rejects shell metacharacters and command-substitution payloads.
          if ! printf '%s' "$FUZZ_ITERATIONS" | grep -Eq '^[1-9][0-9]{0,9}$'; then
            echo "Invalid iterations input (must be a positive integer): $FUZZ_ITERATIONS" >&2
            exit 1
          fi
          ARGS=( "--iterations=${FUZZ_ITERATIONS}" )
          if [ -n "$FUZZ_SEED" ]; then
            # Validate seed is a plain integer (allow leading -, up to 20 digits).
            if ! printf '%s' "$FUZZ_SEED" | grep -Eq '^-?[0-9]{1,20}$'; then
              echo "Invalid seed input (must be an integer): $FUZZ_SEED" >&2
              exit 1
            fi
            ARGS+=( "--seed=${FUZZ_SEED}" )
          fi
          npx tsx .github/fuzzing/fuzz-mdx-sanitizer.ts "${ARGS[@]}"

      - name: Upload fuzz log on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-failure-log
          path: /tmp/fuzz-*.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Create issue on failure
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ github.token }}
          script: |
            const tag = '[fuzz-mdx-failure]';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'ci-failure',
              per_page: 20,
            });
            const existing = issues.find(i => i.title.includes(tag));
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: `Still failing as of ${new Date().toISOString().slice(0, 10)}. [Run](${runUrl})`,
              });
              return;
            }
            try {
              await github.rest.issues.getLabel({ owner: context.repo.owner, repo: context.repo.repo, name: 'ci-failure' });
            } catch {
              await github.rest.issues.createLabel({ owner: context.repo.owner, repo: context.repo.repo, name: 'ci-failure', color: 'b60205' });
            }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `${tag} Weekly MDX sanitizer fuzz run failing`,
              body: [
                '## Weekly MDX sanitizer fuzz run is failing',
                '',
                `**Run:** [${context.runId}](${runUrl})`,
                `**Date:** ${new Date().toISOString().slice(0, 10)}`,
                '',
                'The scheduled fuzz run for sanitizeHtmlForMdx failed, which may indicate a sanitizer regression. The fuzz-failure-log artifact on the run has the details.',
                '',
                '### Re-run',
                '```bash',
                'gh workflow run fuzz-mdx.yml --repo kubestellar/docs',
                '```',
                '',
                '> Auto-generated. This issue will receive comments on subsequent failures.',
              ].join('\n'),
              labels: ['ci-failure'],
            });
