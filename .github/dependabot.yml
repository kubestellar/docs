version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "javascript"
    reviewers:
      - "clubanderson"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
    groups:
      # Keep react + react-dom (and their @types packages) bumped as a single
      # unit. React 19 asserts that react and react-dom share an EXACT version
      # via ensureCorrectIsomorphicReactVersion, and every rendered vitest test
      # calls that assertion. When Dependabot split the 19.3 bump into two
      # separate PRs (#6943 for react, #6946 for react-dom), merging just the
      # first turned main red with 32 failed vitest suites — see #6952 for the
      # full write-up. Grouping forces one combined PR so this class of drift
      # cannot recur.
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
    ignore:
      # typescript-eslint does not support TypeScript 7.x yet (tracked
      # upstream as typescript-eslint/typescript-eslint#12518, closed
      # "not planned" until TS 7.1 ships a stable programmatic API).
      # Dependabot's typescript 6->7 bump (#6314) cannot be merged and
      # was re-proposed every week with no way to land it. Drop this
      # ignore rule once typescript-eslint adds TypeScript 7 support.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "github-actions"
    reviewers:
      - "clubanderson"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "docker"
    reviewers:
      - "clubanderson"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
  - package-ecosystem: "docker"
    directory: "/cluster-objects"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "docker"
    reviewers:
      - "clubanderson"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
  - package-ecosystem: "pip"
    directory: "/cluster-objects"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "python"
    reviewers:
      - "clubanderson"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
