name: Dashboard Lint

on:
  pull_request:
    branches: [main]
    paths:
      - "cluster-objects/dashboard.json"
      - "cluster-objects/alerts.yaml"
      - "src/lib/metrics.ts"
      - "scripts/lint-dashboard.mjs"
      - ".github/workflows/dashboard-lint.yml"

permissions: read-all  # default read; no write permissions needed

jobs:
  dashboard-lint:
    name: dashboard-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint dashboard JSON and alert-rule YAML
        run: npm run lint:dashboard
