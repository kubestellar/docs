name: Dashboard Lint

on:
  pull_request:
    branches: [main]
    paths:
      - "cluster-objects/dashboard-*.json"
      - "cluster-objects/*.yaml"
      - "scripts/lint-dashboards.py"
      - ".github/workflows/dashboard-lint.yml"

permissions: read-all  # default read; no write permissions needed

jobs:
  dashboard-lint:
    name: dashboard-lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.x"
      - name: Install lint dependencies
        run: pip install --no-cache-dir pyyaml
      - name: Lint dashboard JSON and alert-rule YAML
        run: python3 scripts/lint-dashboards.py
